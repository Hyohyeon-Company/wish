# Team CI for Hyohyeon-Company/wish.
#
# Recorded deviation from delivery_policy.json ci.execution (2026-11-07 user
# decision): until a server PC binding exists for this project, CI runs on
# GitHub-hosted runners (ubuntu-latest) instead of the disposable self-hosted
# VM from the public template. Hosted runners are ephemeral, hold no
# production credentials, and this workflow requests only contents: read.
name: Team CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: team-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    name: team-ci
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    # The two container checks (test:integration, test:operations) each start a
    # MySQL 8.4 + API composition, so the job needs more than the pnpm-only
    # budget. Observed durations are recorded in the PR.
    timeout-minutes: 45
    steps:
      # actions/checkout v7.0.1 — full commit SHA verified against the official
      # release tag via git ls-remote and the GitHub tag API (type: commit),
      # 2026-11-07.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actions/setup-node v7.1.0 — SHA verified the same way, 2026-11-07.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install pinned pnpm
        run: npm install -g pnpm@12.18.0
      - name: Validate required checks and pins
        run: node .team/run-ci.mjs --validate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # -----------------------------------------------------------------------
      # Container checks — the implementation lives in
      # scripts/ci-container-gate.mjs, not in this file.
      #
      # `node .team/run-ci.mjs` executes every check the contract declares, and
      # `.team/ci.json` declares test:integration and test:operations as real
      # root scripts. Those scripts call the one container implementation, so
      # the workflow and the contract cannot drift: there is no inline build,
      # compose or health command left here to fall out of sync.
      #
      # The two step-level helpers below only prepare the environment the
      # implementation needs: a buildx builder (the docker driver cannot export
      # a layer cache) and a persistent cache directory. The gate itself decides
      # what to build and how to verify it.
      # -----------------------------------------------------------------------
      # docker/setup-buildx-action v4.4.1 — full commit SHA verified with
      # `git ls-remote https://github.com/docker/setup-buildx-action
      # refs/tags/v4.4.1` and a depth-1 fetch of that commit, 2026-11-10.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # actions/cache v4.3.0 — full commit SHA verified with
      # `git ls-remote https://github.com/actions/cache refs/tags/v4.3.0` and
      # the tag ref API (`object.type: commit`), 2026-11-10.
      #
      # The dependency-install layers dominate the image build and change
      # rarely. The gate writes a buildx `type=local` cache here, so the second
      # image build in the same job (test:integration builds, test:operations
      # rebuilds under the 0600 checkout emulation) and the next run reuse it.
      # A cold cache costs a few extra minutes; a missing cache directory never
      # fails the build.
      - name: Restore the API image layer cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/wish-buildx-cache
          key: wish-buildx-${{ hashFiles('apps/server/Dockerfile', 'pnpm-lock.yaml', 'package.json', 'apps/server/package.json', 'apps/web/package.json', 'scripts/ci-container-gate.mjs') }}
          restore-keys: |
            wish-buildx-
      - name: Execute common checks
        env:
          WISH_BUILDX_CACHE_DIR: /tmp/wish-buildx-cache
        run: node .team/run-ci.mjs
